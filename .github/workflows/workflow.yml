name: Deploy to Production

on:
  push:
    branches:
      - main
      - ci-test
  schedule:
    # IP certificates are short-lived; renew them well before their six-day expiry.
    - cron: '17 3 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, bcmath, pdo_sqlite
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
        env:
          # Composer runs `artisan package:discover`; without .env Laravel
          # defaults to production and rejects intentionally absent CI secrets.
          APP_ENV: testing

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: APP_KEY="base64:$(openssl rand -base64 32)" composer run test
        env:
          # The Composer test script clears config before PHPUnit loads phpunit.xml.
          APP_ENV: testing

  build-artifact:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, bcmath
          tools: composer:v2

      - name: Install composer dependencies (no-dev)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
        env:
          # The artifact is built before the production .env is placed on server.
          APP_ENV: testing

      - name: Setup Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install Node Dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci

      - name: Build frontend
        run: |
          if [ -f package.json ]; then
            npm run build
          fi

      - name: Create artifact
        run: |
          tar -czf release.tar.gz \
            app \
            bootstrap \
            config \
            database \
            docker \
            lang \
            public \
            resources \
            routes \
            vendor \
            .env.example \
            artisan \
            composer.json \
            composer.lock \
            docker-compose.yml \
            package-lock.json \
            package.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build-artifact

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          scp -i ~/.ssh/id_ed25519 release.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/release.tar.gz

          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -se' << 'EOF'

            cd ~/lead-radar

            tar -xzf /tmp/release.tar.gz -C ~/lead-radar

            echo "${{ secrets.ENV_FILE }}" > .env

            webhook_url="$(sed -n 's/^TELEGRAM_WEBHOOK_URL=//p' .env | head -n 1 | tr -d '\r')"
            webhook_ip="${webhook_url#https://}"
            webhook_ip="${webhook_ip%%/*}"
            webhook_ip="${webhook_ip%%:*}"
            if ! [[ "$webhook_url" =~ ^https://[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(/|$) ]]; then
              echo 'TELEGRAM_WEBHOOK_URL must be an HTTPS URL with a public IPv4 address.' >&2
              exit 1
            fi
            letsencrypt_email="$(sed -n 's/^LETSENCRYPT_EMAIL=//p' .env | head -n 1 | tr -d '\r')"
            if [ -z "$letsencrypt_email" ]; then
              echo "LETSENCRYPT_EMAIL must be configured for Let's Encrypt certificate renewal." >&2
              exit 1
            fi

            mkdir -p .tls
            mkdir -p .acme .acme-challenge
            if [ ! -s .tls/telegram-webhook.crt ] || [ ! -s .tls/telegram-webhook.key ] \
              || ! openssl x509 -in .tls/telegram-webhook.crt -noout -ext subjectAltName \
                | grep -Fq "IP Address:$webhook_ip"; then
              openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 3650 \
                -keyout .tls/telegram-webhook.key \
                -out .tls/telegram-webhook.crt \
                -subj "/CN=$webhook_ip" \
                -addext "subjectAltName=IP:$webhook_ip"
              chmod 600 .tls/telegram-webhook.key
            fi

            command -v docker >/dev/null || {
              echo 'Docker is not installed or is not in PATH for the deploy user.' >&2
              exit 127
            }
            docker compose -f docker-compose.yml version >/dev/null
            docker info >/dev/null

            docker compose -f docker-compose.yml down
            docker compose -f docker-compose.yml up -d --build --remove-orphans
            # Wait for MySQL to be ready
            for i in {1..30}; do
              if docker compose -f docker-compose.yml exec -T mysql sh -lc 'mysqladmin ping -h localhost -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" --silent'; then
                break
              fi
              sleep 2
            done
            docker compose -f docker-compose.yml exec -T mysql sh -lc 'mysqladmin ping -h localhost -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" --silent'
            docker compose -f docker-compose.yml run --rm php php artisan migrate --force
            docker compose -f docker-compose.yml run --rm php php artisan route:clear
            docker compose -f docker-compose.yml run --rm php php artisan view:clear
            docker compose -f docker-compose.yml run --rm php php artisan optimize
            docker compose -f docker-compose.yml run --rm php php artisan sitemap:generate

            if [ -s ".acme/live/$webhook_ip/fullchain.pem" ]; then
              docker run --rm \
                -v "$PWD/.acme:/etc/letsencrypt" \
                -v "$PWD/.acme-challenge:/var/www/certbot" \
                certbot/certbot:v5.4.0 renew --quiet
            else
              docker run --rm \
                -v "$PWD/.acme:/etc/letsencrypt" \
                -v "$PWD/.acme-challenge:/var/www/certbot" \
                certbot/certbot:v5.4.0 certonly --webroot \
                --webroot-path /var/www/certbot \
                --ip-address "$webhook_ip" \
                --preferred-profile shortlived \
                --email "$letsencrypt_email" \
                --agree-tos --non-interactive
            fi
            install -m 644 ".acme/live/$webhook_ip/fullchain.pem" .tls/telegram-webhook.crt
            install -m 600 ".acme/live/$webhook_ip/privkey.pem" .tls/telegram-webhook.key
            docker compose -f docker-compose.yml exec -T nginx nginx -s reload
            docker compose -f docker-compose.yml run --rm php php artisan telegram:setup-webhook
          EOF

name: Deploy to Production

on:
  push:
    branches:
      - main
      - ci-test

jobs:
  build-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, pdo, bcmath
          tools: composer:v2

      - name: Install composer dependencies (no-dev)
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install Node Dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci

      - name: Build frontend
        run: |
          if [ -f package.json ]; then
            npm run prod
          fi

      - name: Create artifact
        run: |
          tar -czf release.tar.gz \
            app \
            bootstrap \
            config \
            database \
            docker \
            lang \
            public \
            resources \
            routes \
           .env.example \
            artisan \
            composer.json \
            composer.lock \
            docker-compose.yml \
            package-lock.json \
            package.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build-artifact

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          scp -i ~/.ssh/id_ed25519 release.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/release.tar.gz

          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << EOF

            cd ~/ufamasters

            tar -xzf /tmp/release.tar.gz -C ~/ufamasters

            echo "${{ secrets.ENV_FILE }}" > .env

            docker compose down
            docker compose up -d --build
            # Wait for MySQL to be ready
            for i in {1..30}; do
              if docker compose exec -T mysql mysqladmin ping -h "localhost" -u"${DB_USERNAME}" -p"${DB_PASSWORD}" --silent; then
                break
              fi
              sleep 2
            done
            docker compose run --rm php php artisan migrate --force
            docker compose run --rm php php artisan route:clear
            docker compose run --rm php php artisan view:clear
            docker compose run --rm php php artisan optimize
            docker compose run --rm php php artisan sitemap:generate
          EOF

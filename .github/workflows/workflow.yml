name: Deploy to Production

on:
  push:
    branches:
      - main
      - ci-test

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, bcmath, pdo_sqlite
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
        env:
          # Composer runs `artisan package:discover`; without .env Laravel
          # defaults to production and rejects intentionally absent CI secrets.
          APP_ENV: testing

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: composer run test
        env:
          # The Composer test script clears config before PHPUnit loads phpunit.xml.
          APP_ENV: testing

  build-artifact:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, bcmath
          tools: composer:v2

      - name: Install composer dependencies (no-dev)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
        env:
          # The artifact is built before the production .env is placed on server.
          APP_ENV: testing

      - name: Setup Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install Node Dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci

      - name: Build frontend
        run: |
          if [ -f package.json ]; then
            npm run build
          fi

      - name: Create artifact
        run: |
          tar -czf release.tar.gz \
            app \
            bootstrap \
            config \
            database \
            docker \
            lang \
            public \
            resources \
            routes \
            vendor \
            .env.example \
            artisan \
            composer.json \
            composer.lock \
            docker-compose.yml \
            package-lock.json \
            package.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build-artifact

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          scp -i ~/.ssh/id_ed25519 release.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/release.tar.gz

          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'

            cd ~/lead-radar

            tar -xzf /tmp/release.tar.gz -C ~/lead-radar

            echo "${{ secrets.ENV_FILE }}" > .env

            docker compose down
            docker compose up -d --build --remove-orphans
            # Wait for MySQL to be ready
            for i in {1..30}; do
              if docker compose exec -T mysql sh -lc 'mysqladmin ping -h localhost -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" --silent'; then
                break
              fi
              sleep 2
            done
            docker compose exec -T mysql sh -lc 'mysqladmin ping -h localhost -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" --silent'
            docker compose run --rm php php artisan migrate --force
            docker compose run --rm php php artisan route:clear
            docker compose run --rm php php artisan view:clear
            docker compose run --rm php php artisan optimize
            docker compose run --rm php php artisan sitemap:generate
          EOF

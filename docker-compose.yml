services:
  composer:
    build:
      context: .
      dockerfile: docker/composer/composer.dockerfile
    user: "${UID}:${GID}"
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
  php:
    build:
      context: .
      dockerfile: docker/php/php.dockerfile
    user: "${UID}:${GID}"
    env_file:
      - .env

    volumes:
      - ./:/var/www/html
      - ./docker/php/php-overrides.ini:/usr/local/etc/php/conf.d/php-overrides.ini

    networks:
      - laravel
      # - ufamasters_laravel

  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - laravel
      # - ufamasters_laravel

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.archivarius.rule=Host(`archivarius.ufamasters.ru`)"
      - "traefik.http.routers.archivarius.entrypoints=websecure"
      - "traefik.http.routers.archivarius.tls.certresolver=myresolver"

      - "traefik.http.routers.archivarius-insecure.rule=Host(`archivarius.ufamasters.ru`)"
      - "traefik.http.routers.archivarius-insecure.entrypoints=web"
      - "traefik.http.routers.archivarius-insecure.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

  mysql:
    image: mysql:8.0.38-debian
    environment:
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  redis:
    image: redis:7-alpine
    networks:
      - laravel

  worker-scan:
    build:
      context: .
      dockerfile: docker/php/php.dockerfile
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    networks:
      - laravel
    depends_on:
      mysql:
        condition: service_healthy
      parser:
        condition: service_healthy
    restart: unless-stopped
    # Wait for DB, then process queues (vk.scan needs long Playwright timeout).
    # IMPORTANT: keep queue:work args on ONE logical line — bare newlines inside
    # sh -c end the command early (worker would listen only to "default").
    # Note: do not use `db:show` here — it may fail without php-intl even when DB is up.
    command:
      - sh
      - -c
      - |
        echo 'worker-scan: waiting for database...'
        until php artisan migrate:status >/dev/null 2>&1; do sleep 2; done
        echo 'worker-scan: starting queue:work'
        exec php artisan queue:work "$${QUEUE_CONNECTION:-database}" --queue=vk.scan --tries=2 --timeout=300 --sleep=1 -vvv

  worker-ops:
    build:
      context: .
      dockerfile: docker/php/php.dockerfile
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    networks:
      - laravel
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        echo 'worker-ops: waiting for database...'
        until php artisan migrate:status >/dev/null 2>&1; do sleep 2; done
        echo 'worker-ops: starting queue:work'
        exec php artisan queue:work "$${QUEUE_CONNECTION:-database}" --queue=telegram.webhook,broadcast.telegram,default --tries=2 --timeout=60 --sleep=1 -vvv

  scheduler:
    build:
      context: .
      dockerfile: docker/php/php.dockerfile
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    networks:
      - laravel
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "
        echo 'scheduler: waiting for database...';
        until php artisan migrate:status >/dev/null 2>&1; do sleep 2; done;
        echo 'scheduler: starting schedule:work';
        php artisan schedule:work --verbose
      "

  parser:
    image: mcr.microsoft.com/playwright:v1.61.0-jammy
    user: "${UID}:${GID}"
    working_dir: /app
    env_file:
      - .env
    environment:
      # VK session for logged-in scrapes (see parser/src/auth/login.js)
      VK_LOGIN: "${VK_LOGIN:-}"
      VK_PASSWORD: "${VK_PASSWORD:-}"
      VK_SESSION_PATH: "${VK_SESSION_PATH:-/app/data/vk-storage-state.json}"
      PARSER_SERVICE_TOKEN: "${PARSER_SERVICE_TOKEN}"
    volumes:
    - ./parser:/app
    # Persist session file even if data/ is wiped carefully
    - ./parser/data:/app/data

    networks:
    - laravel

    command: node src/index.js
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(\"http://localhost:3000/health\", {headers:{Authorization: \"Bearer \" + process.env.PARSER_SERVICE_TOKEN}}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:

networks:
  # ufamasters_laravel:
  #   external: true # сеть первого окружения
  laravel:
    driver: bridge

services:
  composer:
    build:
      context: .
      dockerfile: docker/composer/composer.dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
  php:
    build:
      context: .
      dockerfile: docker/php/php.dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
      - ./docker/php/php-overrides.ini:/usr/local/etc/php/conf.d/php-overrides.ini

    networks:
      - laravel

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./.acme-challenge:/var/www/certbot:ro
      - ./.tls:/etc/nginx/tls:ro
    depends_on:
      - php
    networks:
      - laravel

  mysql:
    image: mysql:8.0.38-debian
    environment:
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  redis:
    image: redis:7-alpine
    networks:
      - laravel

  worker-vk:
    build:
      context: .
      dockerfile: docker/php/php.dockerfile
    env_file:
      - .env
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/var/www/html
    networks:
      - laravel
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    # One dedicated worker prevents a long VK wave from delaying Telegram.
    # IMPORTANT: keep queue:work args on ONE logical line — bare newlines inside
    # sh -c end the command early (worker would listen only to "default").
    # Note: do not use `db:show` here — it may fail without php-intl even when DB is up.
    command:
      - sh
      - -c
      - |
        echo 'worker-vk: waiting for database...'
        until php artisan migrate:status >/dev/null 2>&1; do sleep 2; done
        echo 'worker-vk: starting queue:work'
        exec php artisan queue:work redis --queue=vk.scan --tries=2 --timeout=300 --sleep=1 -vvv

  worker-telegram:
    build:
      context: .
      dockerfile: docker/php/php.dockerfile
    env_file:
      - .env
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/var/www/html
    networks:
      - laravel
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    # Keep one MTProto process at a time: all Telegram calls share one session.
    command:
      - sh
      - -c
      - |
        echo 'worker-telegram: waiting for database...'
        until php artisan migrate:status >/dev/null 2>&1; do sleep 2; done
        echo 'worker-telegram: starting queue:work'
        exec php artisan queue:work redis --queue=telegram.scan --tries=2 --timeout=300 --sleep=1 -vvv

  worker-ops:
    build:
      context: .
      dockerfile: docker/php/php.dockerfile
    env_file:
      - .env
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/var/www/html
    networks:
      - laravel
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    command:
      - sh
      - -c
      - |
        echo 'worker-ops: waiting for database...'
        until php artisan migrate:status >/dev/null 2>&1; do sleep 2; done
        echo 'worker-ops: starting queue:work'
        exec php artisan queue:work redis --queue=telegram.webhook,broadcast.telegram,default --tries=2 --timeout=60 --sleep=1 -vvv

  scheduler:
    build:
      context: .
      dockerfile: docker/php/php.dockerfile
    env_file:
      - .env
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/var/www/html
    networks:
      - laravel
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "
        echo 'scheduler: waiting for database...';
        until php artisan migrate:status >/dev/null 2>&1; do sleep 2; done;
        echo 'scheduler: starting schedule:work';
        php artisan schedule:work --verbose
      "

volumes:
  db_data:

networks:
  laravel:
    driver: bridge
